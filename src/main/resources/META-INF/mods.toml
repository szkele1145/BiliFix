modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/szkele1145/BiliFix/issues"

[[mods]]
modId = "bilifix"
version = "1.3.2"
displayName = "BiliFix - Bilibili Media Crash Fix"
displayURL = "https://github.com/szkele1145/BiliFix"
authors = "szkele1145"
description = '''Fixes silent JVM crashes (exit code -1) caused by watermedia/libVLC D3D11VA hardware decoding when playing Bilibili videos in modpacks. Patches VLC launch arguments at runtime: forces software decoding by default (configurable).'''

[[mixins]]
config = "bilifix.mixins.json"

[[dependencies.bilifix]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"

[[dependencies.bilifix]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"

[[dependencies.bilifix]]
modId = "bilibili_media"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"

[[dependencies.bilifix]]
modId = "watermedia"
type = "optional"
versionRange = "[2.1,)"
ordering = "AFTER"
